<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Reports</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="dashboard-container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>SmartRoad</h2>

        <a href="dashboard.html">
            🏠 Dashboard
        </a>

        <a href="hazards.html">
            ⚠️ Manage Hazards
        </a>

        <a href="reports.html" class="active">
            📄 User Reports
        </a>

        <button id="logoutBtn">

            Logout

        </button>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <div class="page-header">

            <div>

                <h1>User Reports</h1>

                <p>
                    View all reports submitted by users.
                </p>

            </div>

        </div>

        <!-- Filter -->

        <div class="filter-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search username, hazard or location">

            <select id="statusFilter">

                <option value="">
                    All Status
                </option>

                <option value="New">
                    New
                </option>

                <option value="Under Investigation">
                    Under Investigation
                </option>

                <option value="Resolved">
                    Resolved
                </option>

            </select>

            <input
                type="date"
                id="dateFilter">

            <button id="resetBtn">

                Reset

            </button>

        </div>

        <!-- Table -->

        <table>

            <thead>

                <tr>

                    <th>No</th>

                    <th>Photo</th>

                    <th>Username</th>

                    <th>Hazard</th>

                    <th>Description</th>

                    <th>Location</th>

                    <th>Date</th>

                    <th>Time</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="reportTableBody">

            </tbody>

        </table>

    </main>

</div>

<script type="module" src="../js/reports.js"></script>

</body>

</html>
