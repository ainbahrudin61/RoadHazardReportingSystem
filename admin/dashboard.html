<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="../css/style.css">

    
</head>

<body>

<div class="dashboard-container">

    <!-- Sidebar -->
    <div class="sidebar">

        <h2>Road Hazard</h2>

        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="hazards.html" class="active">⚠️ Manage Hazards</a>
        <a href="reports.html">📄 User Reports</a>

        <button id="logoutBtn">
            Logout
        </button>

    </div>


    <!-- Main Content -->
    <div class="main-content">
        <br>
        <h1>SMARTROAD ADMIN PANEL</h1>
        <br>
        <p>
            Welcome, Administrator
        </p>


    <!-- Summary -->
    <div class="summary-container">

        <div class="card">
            <h3>Total Users</h3>
            <h1>0</h1>
        </div>

        <div class="card">
            <h3>Total Reports</h3>
            <h1>0</h1>
        </div>

        <div class="card">
            <h3>Open Reports</h3>
            <h1>0</h1>
        </div>

        <div class="card">
            <h3>Resolved Reports</h3>
            <h1>0</h1>
        </div>

    </div>

    <br>
    <br>

    <!-- Recent Reports -->
    <div class="recent-reports">

        <h2>Recent Reports</h2>

        <table>

            <thead>
                <tr>
                    <th>User</th>
                    <th>Hazard</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="recentTable">

                <tr>
                    <td>Ali</td>
                    <td>Flood</td>
                    <td>02/06/2026</td>
                    <td>New</td>
                </tr>

                <tr>
                    <td>Abu</td>
                    <td>Road Damage</td>
                    <td>02/06/2026</td>
                    <td>Repair</td>
                </tr>

            </tbody>

        </table>

    </div>




</div>


<script type="module" src="../js/dashboard.js"></script>

</body>
</html>
