<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Hazard Reports</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="dashboard-container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>SmartRoad</h2>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="hazards.html" class="active">⚠️ Manage Hazard Reports</a>
        <button id="logoutBtn">Logout</button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <div class="page-header">
            <div>
                <h1>Manage Hazard Reports</h1>
                <p>View, search, filter and manage all hazard reports submitted by users.</p>
            </div>
            <a href="addHazard.html" class="add-button">
                <i class="fa-solid fa-plus"></i>
                Add Hazard
            </a>
        </div>

        <!-- Search & Filter -->
        <div class="filter-section">
            <input type="text" id="searchInput" placeholder="Search by user or location">
            
            <select id="hazardTypeFilter">
                <option value="">All Hazard Types</option>
                <option value="Pothole">Pothole</option>
                <option value="Flood">Flood</option>
                <option value="Road Crack">Road Crack</option>
                <option value="Damaged Traffic Light">Damaged Traffic Light</option>
                <option value="Fallen Tree">Fallen Tree</option>
                <option value="Traffic Accident">Traffic Accident</option>
                <option value="Damaged Road Sign">Damaged Road Sign</option>
            </select>

            <select id="statusFilter">
                <option value="">All Status</option>
                <option value="New">New</option>
                <option value="Under Investigation">Under Investigation</option>
                <option value="Repair">Repair</option>
                <option value="Resolved">Resolved</option>
            </select>

            <input type="date" id="dateFilter">
            <button id="resetBtn">Reset</button>
        </div>

        <!-- Table -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Photo</th>
                    <th>User</th>
                    <th>Hazard Type</th>
                    <th>Description</th>
                    <th>Location</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="hazardTableBody">
            </tbody>
        </table>

    </main>

</div>

<script type="module" src="../js/hazard.js"></script>

</body>

</html>
