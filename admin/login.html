<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartRoad Admin Login</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body class="login-page">

<div class="login-container">

    <div class="login-box">

        <img
            src="../images/logo.png"
            class="login-logo"
            alt="SmartRoad Logo">

        <h1>SmartRoad</h1>

        <p>

            Road Hazard Management System

        </p>

        <form id="loginForm">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required>

            </div>

            <button
                type="submit"
                class="login-btn">

                Login

            </button>

        </form>

    </div>

</div>

<footer>

    © 2026 SmartRoad Road Hazard Management System

</footer>

<script
type="module"
src="../js/login.js">

</script>

</body>

</html>
