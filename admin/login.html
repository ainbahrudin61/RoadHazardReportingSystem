<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <style>

        /*LOGIN PAGE*/

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-container{
            width:100%;
            display:flex;
            justify-content:center;
        }

        .login-box{
            width:400px;
            background:#fff;
            padding:40px;
            border-radius:12px;
            box-shadow:0 5px 20px rgba(0,0,0,0.2);
        }

        .login-box h1{
            text-align:center;
            color:#1e3a8a;
            margin-bottom:10px;
        }

        .login-box p{
            text-align:center;
            color:#666;
            margin-bottom:30px;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:5px;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
        }

        button{
            width:100%;
            margin-top:25px;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1d4ed8;
        }

        body.login-page {

            background-image: 
            linear-gradient(
            rgba(0,0,0,0.5),
            rgba(0,0,0,0.5)
            ),url("../images/hazard_bg.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        footer {
    background: white;
    color: var(--dark-navy);
    text-align: center;
    padding: 8px;
    font-size: 0.75rem;
    }

    </style>
</head>

<body class="login-page">

    
    <div class="login-container">

        <div class="login-box">

            <h1>Road Hazard Management System</h1>
            <p>Administrator Login</p>

            <form id="loginForm">

                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    required>

                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required>

                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>

    <script type="module" src="../js/login.js"></script>

</body>
</html>
